services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # La API corre en la maquina host (dsw-api con su propio docker compose)
      API_PROXY_TARGET: http://host.docker.internal:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '5173:5173'
    volumes:
      - ./:/app
      - /app/node_modules
